<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ============================================================= -->
  <!-- REDIRECIONAMENTO 301 - /fascite-plantar/ virou /ondas-de-      -->
  <!-- choque/ (pagina mais ampla, cobre toda a terapia por ondas de  -->
  <!-- choque). O 301 verdadeiro e feito pelo vercel.json na raiz do   -->
  <!-- projeto (redirects). Este arquivo e o fallback para hosts que   -->
  <!-- servem a pasta estatica diretamente: meta refresh + canonical   -->
  <!-- + redirect por JS, para nao deixar link morto em nenhum cenario.-->
  <!-- NAO indexar: o canonical aponta para a pagina nova.             -->
  <!-- ============================================================= -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://humanaortopedia.com.br/ondas-de-choque/">
  <meta http-equiv="refresh" content="0; url=/ondas-de-choque/">
  <script>window.location.replace('/ondas-de-choque/');</script>

  <title>Redirecionando para Ondas de Choque | Humana Ortopedia</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f8f5ef;
      color: #1a2e4a;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    a { color: #2563a8; font-weight: 600; }
  </style>
</head>
<body>
  <p>
    Esta página foi ampliada. Se você não for redirecionado automaticamente,
    <a href="/ondas-de-choque/">acesse a página de Ondas de Choque</a>.
  </p>
</body>
</html>
