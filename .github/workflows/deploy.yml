name: Build & Deploy to HostGator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Add SPA fallback (.htaccess)
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          # Humana Ortopedia - SPA + WordPress hybrid
          Options -MultiViews
          RewriteEngine On

          # Do not rewrite WordPress blog
          RewriteRule ^blog/ - [L]
          RewriteRule ^blog$ - [L]
          RewriteRule ^wp/ - [L]
          RewriteRule ^wp-admin/ - [L]
          RewriteRule ^wp-includes/ - [L]
          RewriteRule ^wp-content/ - [L]

          # Do not rewrite real files/dirs
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]

          # SPA fallback
          RewriteRule ^ index.html [L]

          # Gzip
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
          </IfModule>

          # Cache static assets
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType font/woff2 "access plus 1 year"
          </IfModule>
          HTACCESS

      - name: Deploy to HostGator via FTP (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            staging/**
            wp/**
            blog/**
            public_html/**
            wp-admin/**
            wp-includes/**
            wp-content/**
            wp-config.php
            wp-config-sample.php
            wp-login.php
            wp-cron.php
            wp-blog-header.php
            wp-load.php
            wp-mail.php
            wp-settings.php
            wp-signup.php
            wp-trackback.php
            xmlrpc.php
            license.txt
            readme.html
